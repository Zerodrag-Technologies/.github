name: Question
description: Ask a question about hardware, software, or firmware projects
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Ask away — please include enough context to help us answer accurately.
  - type: dropdown
    id: area
    attributes:
      label: Scope
      description: What does your question relate to?
      options:
        - Hardware
        - Software
        - Firmware
        - Cross-functional
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add links, screenshots, examples, or background info.
