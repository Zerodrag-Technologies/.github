name: Software/Firmware Bug
description: Report an issue with software or firmware
labels:
  - bug
  - software
  - firmware
body:
  - type: markdown
    attributes:
      value: |
        Please include steps to reproduce and, if this is firmware-related, hardware details as well.
  - type: dropdown
    id: subtype
    attributes:
      label: Issue Scope
      description: What is affected?
      options:
        - Software
        - Firmware
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: V0.1, V2.0.3 etc.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What is happening and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware Details
      description: Fill this out if the issue involves firmware.
      placeholder: Board revision, connected peripherals, power source, sensors, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Add any relevant logs, screenshots, traces, or dumps.
