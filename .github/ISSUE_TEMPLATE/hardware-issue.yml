name: Hardware Issue
description: Report an issue with hardware designs.
labels:
  - bug
  - hardware
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail for someone to reproduce or investigate the hardware issue.
  - type: dropdown
    id: subtype
    attributes:
      label: Issue Scope
      description: Which part of the hardware design is affected?
      options:
        - PCB
        - Schematic
        - BoM
        - Assembly
        - Mechanical
        - Other
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Variant
      placeholder: e.g. D1, D2 etc.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      placeholder: e.g. R0.1, R0.2, R0.2B etc.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What is wrong and what did you expect instead?
      placeholder: Describe the issue in detail.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / References
      description: Add links, screenshots, schematic pages, PCB refs, measurements, photos, or logs.
      placeholder: Include relevant references.
